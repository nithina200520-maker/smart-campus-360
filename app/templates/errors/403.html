{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card campus-card border-0 shadow p-5 d-inline-block mx-auto" style="max-width: 500px;">
    <i class="fa-solid fa-lock fa-4x text-danger mb-3"></i>
    <h2 class="fw-bold text-dark">403 - Access Forbidden</h2>
    <p class="text-muted small mb-4">
      Your current role credentials do not possess authorized privileges to access this institutional resource.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
      <i class="fa-solid fa-house me-1"></i> Return to Campus Home
    </a>
  </div>
</div>
{% endblock %}
