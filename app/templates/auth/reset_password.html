{% extends "base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      
      <div class="card campus-card border-0 shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex p-3 text-primary mb-2">
            <i class="fa-solid fa-lock-open fa-2x"></i>
          </div>
          <h3 class="fw-bold text-dark">Reset Account Password</h3>
          <p class="text-muted small">Enter a new secure password for <strong>{{ user.email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
          
          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
              <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
            </div>
            <div class="form-text small">Minimum 8 characters with letters and numbers.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small text-secondary">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-check text-muted"></i></span>
              <input type="password" name="confirm_password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold mb-3 shadow-sm">
            Save New Password <i class="fa-solid fa-arrow-right ms-1"></i>
          </button>
        </form>

        <div class="text-center small text-muted">
          Cancel and return to <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold text-decoration-none">Sign In</a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
