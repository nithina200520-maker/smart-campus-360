# ==============================================================================
# SMART CAMPUS 360 - Docker Compose (introduced in Phase 2)
#
# Default (zero-friction): single `web` service + existing Phase 1 SQLite data
#   (bind-mounted from ./instance — no migration, no data loss).
#
# Optional MySQL:  docker compose --profile mysql up -d
#   then set DOCKER_USE_SQLITE=False in .env so the app targets the `db`
#   service, and seed it with:  docker compose exec web python init_db.py
#
# Compose reads the project's .env for variable interpolation automatically.
# ==============================================================================
name: smart-campus-360

services:
  web:
    build: .
    container_name: smart-campus-web
    ports:
      # Host port kept configurable; default 8080 so it never clashes with
      # the local `python run.py` dev server on 5000.
      - "${WEB_PORT:-8080}:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-smart-campus-360-change-me-in-production}
      # --- Database connection strategy -------------------------------------
      # True  -> SQLite at /app/instance/smart_campus_360.db (bind-mounted,
      #          preserves all Phase 1 accounts/data exactly as-is)
      # False -> MySQL service below (internal hostname `db`)
      USE_SQLITE: ${DOCKER_USE_SQLITE:-True}
      DB_HOST: ${DOCKER_DB_HOST:-db}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      # Never hard-coded; resolved from .env at runtime, kept out of the image
      DB_PASSWORD: ${DB_PASSWORD:-no-password-set}
      DB_NAME: ${DB_NAME:-smart_campus_360}
      # --- Campus information ------------------------------------------------
      COLLEGE_NAME: ${COLLEGE_NAME:-Government Engineering College, Mosalehosahalli}
      COLLEGE_LOCATION: ${COLLEGE_LOCATION:-Hassan, Karnataka, India}
      APP_NAME: ${APP_NAME:-Smart Campus 360}
    volumes:
      # Persistent SQLite database (existing Phase 1 data preserved)
      - ./instance:/app/instance
      # Persistent uploaded files (waypoint photos, lost&found images,
      # canteen menu photos, order QR codes)
      - ./app/static/uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Optional MySQL 8.0 (the README's intended production database).
  # Only started with: docker compose --profile mysql up -d
  # NOT published to the host — reachable only on the internal network.
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    profiles: ["mysql"]
    container_name: smart-campus-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env for the mysql profile}
      MYSQL_DATABASE: ${DB_NAME:-smart_campus_360}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql   # named volume: persistent, never bind-mounted over
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
